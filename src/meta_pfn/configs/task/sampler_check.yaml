# E0 follow-up (tasks/sampler_check.py): the pilot's importance-sampling Bayes learner vs an SMC one.
defaults:
  - headroom   # same pairs, PFN, grid and the pilot's hypothesis set (kind_is reproduces the pilot)
  - _self_
name: sampler_check
kind: warp            # window | warp; rho is 0
