# AIR-CIS (tasks/air_cis.py; issue #22, notebook 17). Spec: research_log/entries/2026-11-04_air-cis.md (spec + addendum).
# Prior: experimental/air/cis/prior.py (sampled-architecture BNN g, J in {0,2,4,8,16}, windowed T, h latent).
name: air_cis
mode: dec_train         # dec_train | mt_train | eval
# decoder D (AIR's transported PFN + the T' feature)
dm: 128
layers: 6
tfeat: true             # false = the C8 ablation
batch: 64
lr: 3e-4
clip: 20.0
max_steps: 150000       # cap of the plateau rule
min_steps: 20000
every: 250
# MTPFN / A-only (#20's architecture: 1.84M parameters)
aonly: false
mt_dm: 128
mt_heads: 4
mt_pairs: 4
mt_dff: 512
mt_steps: 100000
mt_batch: 64
mt_lr: 1e-4
mt_warmup: 1000
mt_clip: 1.0
# eval
decoder_ckpt: ""
decoder_nf_ckpt: ""     # the C8 ablation decoder (optional)
mtpfn_ckpt: ""
aonly_ckpt: ""
n_eval: 256
eval_seed: 777
ks: [32, 128]
rounds: [1, 3]
k_ref: 8192
device: cuda
threads: 4
